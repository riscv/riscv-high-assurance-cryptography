---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: forbidden-file-extensions
        name: forbidden-file-extensions
        entry: disallow these file extensions
        language: fail
        # Disallow other asciidoc extensions except .adoc
        files: .*\.(asciidoc|asc)$

      # A link to an anchor in another chapter must name that chapter's page
      # (<<Zkl-notation.adoc#KLEE-Notation>>), or it is broken on the website.
      - id: cross-page-refs
        name: cross-page-refs
        entry: python3 scripts/check-cross-page-refs.py
        language: system
        pass_filenames: false
        files: ^modules/ROOT/pages/.*\.adoc$

  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        args: [--mapping, '2', --sequence, '4', --offset, '2']
        # antora.yml is rewritten at release time by scripts/stamp-antora-version.sh,
        # which replaces values line by line. yamlfmt line-wraps long plain scalars
        # (e.g. page-phase-notice), which splits a value across two lines and makes
        # the stamp emit invalid YAML. Leave this file alone.
        exclude: ^antora\.yml$
