---
name: known-answer tests

# The scripts in src/kat/*-kat.py implement each algorithm twice: once straight from the
# standard it reproduces (REF) and once from the formulas as written in this
# specification (ACE), and compare the two against published vectors.  Several also
# evaluate a formulation the specification used to carry, to demonstrate that the test
# is able to fail.  Running them on every push and pull request is what turns them from
# documentation into a guard against transcription errors in Book 2.

on:
  pull_request:
    paths:
      # every harness, and the shared modules they import (common.py,
      # fips203.py, fips204.py, ecc_curves.py) -- a change to one of those
      # affects every harness that imports it
      - src/kat/**
      - src/run-kats.py
      - src/ace-ISA-algorithms.adoc
      - src/ace-ISA-unpriv.adoc
      - src/ace-notation.adoc
      - .github/workflows/kat.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Run all known-answer tests
        run: python3 src/run-kats.py
